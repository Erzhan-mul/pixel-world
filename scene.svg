    <path d="M750 110H760V100H770V110H780V120H770V130H760V120H750Z"/>
  </g>

  <g class="cloud-drift animated">
    <path d="M150 180H180V170H220V180H250V190H270V210H140V200H130V190H150Z" fill="#24458b"/>
    <path d="M180 170H220V180H240V190H250V200H150V190H180Z" fill="#396fc5"/>
    <path d="M180 170H220V180H180ZM150 190H180V200H150Z" fill="#5d94d9"/>
