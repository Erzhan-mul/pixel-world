<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" shape-rendering="crispEdges" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Синий час, восемь бит</title>
  <desc id="scene-desc">Пиксельная комната со светящимся компьютером и растениями. За широким окном — ночной город, океан, голубая луна и медленно плывущие облака.</desc>
  <style>
    .cloud-drift{animation:pixelCloud 18s steps(8,end) infinite}
    .cloud-drift.cloud-two{animation-duration:24s;animation-delay:-9s}
    .orbiting-light{animation:pixelStar 5s steps(1,end) infinite}
    .orbiting-light.star-two{animation-delay:-2s;animation-duration:7s}
    .screen-cursor{animation:pixelCursor 1.6s steps(1,end) infinite}
    .island-float{animation:pixelFloat 8s steps(4,end) infinite}
    .water-glimmer{animation:pixelWater 6s steps(1,end) infinite}
    .motion-paused .animated{animation-play-state:paused}
    @keyframes pixelCloud{0%,100%{transform:translateX(-10px)}50%{transform:translateX(30px)}}
    @keyframes pixelStar{0%,35%,100%{opacity:1}36%,70%{opacity:.25}}
    @keyframes pixelCursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pixelFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes pixelWater{0%,49%{opacity:.7}50%,100%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.animated{animation-play-state:paused!important}.motion-enabled .animated{animation-play-state:running!important}}
  </style>

  <!-- Every contour is drawn on the same ten-pixel grid. -->
  <path d="M0 0H900V650H0Z" fill="#060a14"/>
  <path d="M0 0H900V440H0Z" fill="#0c142b"/>
  <path d="M0 0H900V20H0ZM0 20H20V650H0ZM880 20H900V650H880Z" fill="#152859"/>
  <path d="M20 20H880V30H20ZM20 30H30V430H20ZM870 30H880V430H870Z" fill="#1b3269"/>

  <!-- A deep window frame, a large blue night, and the far horizon. -->
  <path d="M90 60H810V70H820V410H810V420H90V410H80V70H90Z" fill="#040915"/>
  <path d="M90 70H810V410H90Z" fill="#2859bd"/>
  <path d="M100 80H800V400H100Z" fill="var(--scene-sky,#101e49)"/>
  <path d="M100 250H800V270H100Z" fill="var(--scene-horizon,#162b63)"/>
  <path d="M100 270H800V290H100Z" fill="var(--scene-ocean-1,#1b3776)"/>
  <path d="M100 290H800V310H100Z" fill="var(--scene-ocean-2,#244990)"/>
  <path d="M100 310H800V400H100Z" fill="var(--scene-ocean-3,#1b3d80)"/>
  <path d="M100 330H800V340H100ZM100 360H800V370H100ZM100 390H800V400H100Z" fill="#214b98"/>

  <!-- A stepped cyan moon with three small crater marks. -->
  <g class="island-float animated">
    <path d="M660 100H710V110H730V120H740V140H750V180H740V200H730V210H710V220H660V210H640V200H630V180H620V140H630V120H640V110H660Z" fill="#66b5db"/>
    <path d="M660 100H700V110H720V120H730V140H740V170H730V190H720V200H700V210H660V200H640V190H630V140H640V120H650V110H660Z" fill="var(--scene-sun,#b2e4f1)"/>
    <path d="M660 100H700V110H720V120H680V130H650V150H640V170H630V140H640V120H650V110H660Z" fill="#dcecfb"/>
    <path d="M690 150H710V160H720V170H710V180H690V170H680V160H690ZM650 180H670V190H650ZM690 120H700V130H690Z" fill="#8ad5ed"/>
  </g>

  <!-- Sparse star pixels keep the sky calm instead of noisy. -->
  <g class="stars" fill="#8ad5ed">
    <path d="M170 110H180V120H170ZM310 100H320V110H310ZM420 140H430V150H420ZM560 110H570V120H560ZM760 250H770V260H760ZM570 220H580V230H570ZM210 240H220V250H210Z"/>
